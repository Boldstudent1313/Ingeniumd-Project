<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accessible Text Parser & Reader</title>
  <!-- PDF.js for reading PDF documents -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Tesseract.js for extracting text from images -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1.5rem; line-height: 1.8; background-color: #000000; color: #ffffff; font-size: 1.2rem; }
    .card { background: #121212; padding: 2.5rem; border-radius: 12px; border: 3px solid #ffff00; }
    h1 { margin-top: 0; font-size: 2.2rem; color: #ffff00; border-bottom: 2px solid #ffff00; padding-bottom: 10px; }
    
    .upload-area { border: 4px dashed #ffff00; padding: 2.5rem; text-align: center; border-radius: 8px; margin: 2rem 0; cursor: pointer; display: block; background: #1a1a1a; }
    .upload-area:hover, .upload-area:focus { background: #333300; outline: 4px solid #ffffff; }
    input[type="file"] { opacity: 0; position: absolute; z-index: -1; }
    
    button { background: #ffff00; color: #000000; border: 3px solid #ffff00; padding: 15px 30px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.4rem; margin-top: 1rem; }
    button:hover, button:focus { background: #ffffff; border-color: #ffffff; outline: 4px solid #ffff00; }
    button:disabled { background: #444; border-color: #444; color: #888; cursor: not-allowed; }
    
    .result-box { margin-top: 2rem; padding: 1.5rem; background: #1a1a1a; border-left: 8px solid #ffff00; border-radius: 4px; display: none; }
    .result-box h2 { color: #ffff00; margin-top: 0; }
    .status-text { color: #58a6ff; font-weight: bold; margin-top: 1rem; }
  </style>
</head>
<body>
  <main class="card">
    <h1 tabindex="0">Accessible Text Parser & Reader</h1>
    <p tabindex="0">Upload an Image or PDF document. The app will extract all readable text and read it aloud instantly.</p>
    
    <label class="upload-area" for="fileInput" tabindex="0" role="button" aria-label="Select an image or PDF file">
      <span id="uploadText">Click or press Enter here to select a file (PNG, JPG, PDF)</span>
      <input type="file" id="fileInput" accept="image/*,application/pdf" />
    </label>
    
    <div id="statusText" class="status-text" aria-live="polite"></div>

    <section class="result-box" id="resultBox" aria-live="assertive" tabindex="-1">
      <h2>Extracted Text</h2>
      <p id="extractedTextContent" style="white-space: pre-wrap;"></p>
    </section>

    <button id="readAloudBtn" style="display:none;">🔊 Read Again</button>
  </main>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const fileInput = document.getElementById('fileInput');
    const uploadText = document.getElementById('uploadText');
    const statusText = document.getElementById('statusText');
    const resultBox = document.getElementById('resultBox');
    const extractedTextContent = document.getElementById('extractedTextContent');
    const readAloudBtn = document.getElementById('readAloudBtn');

    let lastExtractedText = "";

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      uploadText.innerText = "Selected: " + file.name;
      window.speechSynthesis.cancel();
      resultBox.style.display = 'none';
      readAloudBtn.style.display = 'none';
      statusText.innerText = "Extracting text from file...";

      try {
        let text = "";

        if (file.type === "application/pdf") {
          text = await extractTextFromPDF(file);
        } else if (file.type.startsWith("image/")) {
          text = await extractTextFromImage(file);
        } else {
          throw new Error("Unsupported file type. Please upload a PDF or Image.");
        }

        if (!text || text.trim().length === 0) {
          text = "No readable text found in this file.";
        }

        lastExtractedText = text;
        statusText.innerText = "Text extraction complete!";
        extractedTextContent.innerText = text;
        resultBox.style.display = 'block';
        resultBox.focus();
        readAloudBtn.style.display = 'block';

        speakText(text);

      } catch (err) {
        statusText.innerText = "Error: " + err.message;
      }
    });

    async function extractTextFromPDF(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullText = "";

      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const tokenizedText = await page.getTextContent();
        const pageText = tokenizedText.items.map(item => item.str).join(' ');
        fullText += `--- Page ${i} ---\n` + pageText + "\n\n";
      }
      return fullText;
    }

    async function extractTextFromImage(file) {
      statusText.innerText = "Scanning image for text (OCR in progress)...";
      const result = await Tesseract.recognize(file, 'eng', {
        logger: m => {
          if (m.status === 'recognizing text') {
            statusText.innerText = `OCR Progress: ${Math.round(m.progress * 100)}%`;
          }
        }
      });
      return result.data.text;
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    readAloudBtn.addEventListener('click', () => {
      if (lastExtractedText) {
        speakText(lastExtractedText);
      }
    });
  </script>
</body>
</html>
