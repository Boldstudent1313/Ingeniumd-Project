<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Vision & Document Analyzer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --text-color: #f0f6fc;
      --accent-color: #58a6ff;
      --accent-hover: #1f6feb;
      --border-color: #30363d;
      --error-color: #f85149;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 700px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.6rem;
      margin-top: 0;
      color: var(--accent-color);
      text-align: center;
    }
    .dropzone {
      border: 2px dashed var(--accent-color);
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 20px;
      transition: background 0.2s ease;
    }
    .dropzone:focus, .dropzone:hover {
      background: rgba(88, 166, 255, 0.1);
      outline: 3px solid var(--accent-color);
    }
    input[type="file"] { display: none; }
    button {
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: background 0.2s ease;
    }
    button:hover, button:focus {
      background-color: var(--accent-hover);
      outline: 3px solid #ffffff;
    }
    button:disabled {
      background-color: var(--border-color);
      cursor: not-allowed;
    }
    .preview-container { text-align: center; margin: 15px 0; }
    #imagePreview {
      max-width: 100%;
      max-height: 300px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      display: none;
    }
    .status-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      background: #010409;
      border: 1px solid var(--border-color);
      min-height: 80px;
    }
    .error-box {
      color: var(--error-color);
      border-color: var(--error-color);
      display: none;
      margin-top: 10px;
      padding: 12px;
      border-radius: 6px;
      background: rgba(248, 81, 73, 0.1);
    }
    .controls { display: flex; gap: 10px; margin-top: 15px; }
    .controls button { flex: 1; }
  </style>
</head>
<body>
  <div class="container" role="main">
    <h1>Accessible Vision & Document Analyzer</h1>
    
    <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Upload photo or PDF file. Click or drag and drop here.">
      <p id="dropText">Click or Drag & Drop Photo or PDF here</p>
      <input type="file" id="fileInput" accept="image/*,application/pdf">
    </div>

    <div class="preview-container">
      <img id="imagePreview" alt="Uploaded file preview">
    </div>

    <button id="analyzeBtn" disabled aria-label="Analyze photo and generate description">Analyze File</button>

    <div id="errorBox" class="error-box" role="alert" aria-live="assertive"></div>

    <div class="status-box" id="resultRegion" role="region" aria-live="polite" aria-label="Analysis Results">
      <h2 style="font-size: 1.1rem; margin-top: 0;">Description:</h2>
      <p id="descriptionText">No file analyzed yet. Select a photo or PDF above and click Analyze.</p>
    </div>

    <div class="controls">
      <button id="speakBtn" disabled aria-label="Read description aloud">🔊 Read Aloud</button>
      <button id="stopBtn" disabled aria-label="Stop text to speech">⏹️ Stop</button>
    </div>
  </div>

  <script>
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const dropText = document.getElementById('dropText');
    const imagePreview = document.getElementById('imagePreview');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const descriptionText = document.getElementById('descriptionText');
    const errorBox = document.getElementById('errorBox');
    const speakBtn = document.getElementById('speakBtn');
    const stopBtn = document.getElementById('stopBtn');

    let currentCompressedBase64 = null;

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        fileInput.click();
      }
    });

    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.style.background = 'rgba(88, 166, 255, 0.2)';
    });

    dropzone.addEventListener('dragleave', () => {
      dropzone.style.background = 'transparent';
    });

    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.style.background = 'transparent';
      if (e.dataTransfer.files.length > 0) {
        handleFileSelect(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFileSelect(e.target.files[0]);
      }
    });

    async function handleFileSelect(file) {
      errorBox.style.display = 'none';
      descriptionText.textContent = "File loaded. Ready to analyze.";
      dropText.textContent = `Selected: ${file.name}`;

      try {
        if (file.type === 'application/pdf') {
          currentCompressedBase64 = await processPdf(file);
        } else if (file.type.startsWith('image/')) {
          currentCompressedBase64 = await compressImageFile(file);
        } else {
          showError("Unsupported file type. Please upload a photo or PDF.");
          return;
        }

        imagePreview.src = currentCompressedBase64;
        imagePreview.style.display = 'block';
        analyzeBtn.disabled = false;
      } catch (err) {
        showError("Failed to process file locally: " + err.message);
      }
    }

    function compressImageFile(file, maxDim = 800) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
              else { w = Math.round((w * maxDim) / h); h = maxDim; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.85));
          };
          img.onerror = () => reject(new Error("Image loading failed"));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error("File reading failed"));
        reader.readAsDataURL(file);
      });
    }

    async function processPdf(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const page = await pdf.getPage(1);
      const viewport = page.getViewport({ scale: 1.5 });

      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      const ctx = canvas.getContext('2d');

      await page.render({ canvasContext: ctx, viewport: viewport }).promise;

      let w = canvas.width, h = canvas.height, maxDim = 800;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
        else { w = Math.round((w * maxDim) / h); h = maxDim; }
      }
      const scaledCanvas = document.createElement('canvas');
      scaledCanvas.width = w; scaledCanvas.height = h;
      scaledCanvas.getContext('2d').drawImage(canvas, 0, 0, w, h);

      return scaledCanvas.toDataURL('image/jpeg', 0.85);
    }

    analyzeBtn.addEventListener('click', async () => {
      if (!currentCompressedBase64) return;

      errorBox.style.display = 'none';
      descriptionText.textContent = "Analyzing file with AI... Please wait.";
      analyzeBtn.disabled = true;

      try {
        const res = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: currentCompressedBase64 })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || `Server responded with status ${res.status}`);
        }

        descriptionText.textContent = data.description;
        speakBtn.disabled = false;
        speakText(data.description);
      } catch (err) {
        showError("Analysis Error: " + err.message);
        descriptionText.textContent = "Failed to obtain description.";
      } finally {
        analyzeBtn.disabled = false;
      }
    });

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.onend = () => { stopBtn.disabled = true; };
      window.speechSynthesis.speak(utterance);
      stopBtn.disabled = false;
    }

    speakBtn.addEventListener('click', () => {
      if (descriptionText.textContent) speakText(descriptionText.textContent);
    });

    stopBtn.addEventListener('click', () => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        stopBtn.disabled = true;
      }
    });
  </script>
</body>
</html>
